# GitHub Actions: 云端 macOS 编译 iOS App(无需自己的 Mac)
#
# 用法:
#   1. 在 GitHub 新建仓库, 把 toyctl-ios 目录的**内容**作为仓库根推送上去
#   2. Actions 页面等 "iOS Build" 跑完 → 下载 artifact "ToyCtl-unsigned-ipa"
#   3. 拿到未签名 ipa 后, 用 Sideloadly / AltStore / 爱思助手 用自己的 Apple ID
#      签名安装到 iPhone(免费 Apple ID 7 天有效期, 到期重签)

name: iOS Build
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu runner OK"

  build:
    needs: probe
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned, for device)
        run: |
          xcodebuild -project ToyCtl.xcodeproj -scheme ToyCtl \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ToyCtl.app Payload/
          zip -qry ToyCtl-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ToyCtl-unsigned-ipa
          path: ToyCtl-unsigned.ipa
