# XcodeGen 工程描述 — GitHub Actions 上自动生成 .xcodeproj
name: ToyCtl
options:
  bundleIdPrefix: com.toyctl
  deploymentTarget:
    iOS: "15.0"
targets:
  ToyCtl:
    type: application
    platform: iOS
    sources:
      - ToyCtl
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ToyCtl/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: 连接并控制 ToyCtl 设备
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
